# The backend tests are plain unittest tests. Two ways to run all of them,
# from this folder (same 2,000+ tests either way):
#   fast, on several cores (needs pytest + pytest-xdist):
#     python -m pytest -n 8 --dist worksteal -q
#   classic, one core:
#     python -m unittest discover -s tests -p "test_*.py"
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -p no:cacheprovider
